<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { width: 360px; min-height: 250px; margin: 0; padding: 14px; background: #0d0d0d; color: #fafafa; font: 13px/1.5 "DM Sans", Inter, system-ui, sans-serif; }
      main { min-height: 222px; padding: 14px; border: 1px solid #262626; background: #141414; }
      header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 13px; border-bottom: 1px solid #262626; }
      .mark { color: #fafafa; font: 800 18px/1 "Sora", "Segoe UI", sans-serif; letter-spacing: -.06em; }
      .mark b { color: #c53400; font-weight: inherit; }
      .network { color: #616161; font: 10px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .13em; text-transform: uppercase; }
      section { position: relative; margin-top: 14px; padding: 14px; border: 1px solid #262626; border-left: 2px solid #c53400; background: #000; }
      .eyebrow { margin: 0 0 8px; color: #c53400; font: 10px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font: 800 19px/1.1 "Sora", "Segoe UI", sans-serif; letter-spacing: -.04em; text-transform: uppercase; }
      p { margin: 10px 0 0; color: rgba(250, 250, 250, .65); }
      .state { display: flex; align-items: center; gap: 7px; margin-top: 15px; color: #fafafa; font: 10px/1.2 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; }
      .dot { width: 7px; height: 7px; background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, .12); }
    </style>
  </head>
  <body>
    <main>
      <header><span class="mark">Trust<b>X</b></span><span class="network">Private STRK</span></header>
      <section>
        <p class="eyebrow">TEE replay</p>
        <h1>Amazon Pay attestation</h1>
        <p>Open TrustX at <strong>trustx-ui.vercel.app</strong> to replay a receipt and request its Stark signature. No session data is stored.</p>
        <div class="state"><span class="dot"></span> Sepolia signer ready</div>
      </section>
    </main>
  </body>
</html>
